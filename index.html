<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>狐假虎威</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: full-screen 3D world behind translucent paper panels; HUD floats over the world. */
:root{
  --bg:#f3dfaa;        /* 暖黃 */
  --ink:#2a1d14;       /* 墨 */
  --red:#c4352b;       /* 朱紅 */
  --lime:#dcd6c6;      /* 石灰 */
  --gold:#e8b94a;
  --paper:#fbf2d6;
  --line:#8a6a3c;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
.screen{position:fixed;inset:0;display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.screen.on{display:flex}
.btn{background:var(--red);color:#fff8e6;border:2px solid var(--ink);border-radius:4px;padding:.6em 1.4em;font-weight:700;letter-spacing:.12em;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.sm{padding:.35em .8em;font-size:.85rem;letter-spacing:.04em;box-shadow:2px 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 rgba(42,29,20,.85);padding:clamp(14px,3vw,28px);width:min(920px,100%);max-height:calc(100% - 24px);overflow:auto}
h1,h2,h3{font-family:var(--serif);margin:0}
.foot{font-size:.78rem;color:var(--ink);opacity:.8;margin-top:12px;text-align:center}

/* cover */
#cover{align-items:flex-start;justify-content:center;background:linear-gradient(90deg,rgba(243,223,170,.92) 0%,rgba(243,223,170,.55) 45%,rgba(243,223,170,0) 80%)}
#cover .wrap{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-start;padding-left:clamp(0px,4vw,60px)}
.vtitle{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(64px,15vh,140px);line-height:1.12;letter-spacing:.08em;color:var(--ink);text-shadow:3px 3px 0 var(--lime);margin:0}
.seal{display:inline-block;background:var(--red);color:#fff8e6;font-family:var(--serif);font-weight:900;padding:.25em .4em;border-radius:3px;font-size:1.1rem;writing-mode:vertical-rl;letter-spacing:.2em}
.coverSide{display:flex;flex-direction:column;gap:14px;padding-top:6vh;max-width:340px}
.coverSide p{margin:0;line-height:1.7}
.coverBtns{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#cover .foot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;text-align:left}
.mtog{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.mtog button,.hudb{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:.3em .6em;font-size:1.05rem}
.mtog button[aria-pressed="false"],.hudb[aria-pressed="false"]{opacity:.45;text-decoration:line-through}

/* create */
.createGrid{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px}
#prevWrap{background:var(--lime);border:2px solid var(--ink);border-radius:4px;aspect-ratio:3/4;width:100%}
#prev{width:100%;height:100%;display:block}
.optRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.optRow label{width:4.2em;font-weight:700}
.chip{background:#fff;border:2px solid var(--line);border-radius:3px;padding:.25em .7em;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--red);color:#fff8e6;border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--lime)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
#nameIn{font:inherit;padding:.35em .6em;border:2px solid var(--ink);border-radius:3px;background:#fff;width:9em}
@media(max-width:640px){.createGrid{grid-template-columns:1fr}#prevWrap{aspect-ratio:4/3;max-height:34vh}}

/* pager (intro/story) */
.pgHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.tag{display:inline-block;background:var(--red);color:#fff8e6;font-family:var(--serif);font-weight:900;padding:.1em .7em;border-radius:3px;letter-spacing:.2em}
.pgBody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.pgBody img{width:100%;border:2px solid var(--ink);border-radius:4px;display:block;background:var(--lime);aspect-ratio:16/9}
.pgBody .txt{font-family:var(--serif);font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.9}
.pgNav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;gap:5px;align-items:center}.dots i{width:9px;height:9px;border-radius:50%;background:var(--lime);border:1px solid var(--line)}.dots i.on{background:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{border:2px solid var(--ink);border-radius:4px;padding:12px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.card b{font-family:var(--serif);font-size:1.15rem}.card p{margin:.3em 0 0;line-height:1.6;font-size:.95rem}
.glyph{flex:0 0 auto;width:46px;height:46px;background:var(--red);color:#fff8e6;font-family:var(--serif);font-weight:900;font-size:1.7rem;display:grid;place-items:center;border-radius:3px}
.sum3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sum3 div{border:2px solid var(--ink);background:#fff;border-radius:4px;padding:10px;line-height:1.7}
@media(max-width:700px){.pgBody{grid-template-columns:1fr}}

/* game HUD */
#game{justify-content:flex-start;align-items:stretch;pointer-events:none}
#game>*{pointer-events:auto}
#hudTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding-top:10px;flex-wrap:wrap}
.hbox{background:rgba(251,242,214,.92);border:2px solid var(--ink);border-radius:4px;padding:6px 10px;line-height:1.4;font-size:.9rem}
#hudGoal{font-family:var(--serif);font-weight:900;max-width:min(380px,100%)}
#hudTokens{display:flex;gap:4px;flex-wrap:wrap;max-width:260px;justify-content:flex-end}
.tk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-family:var(--serif);font-weight:900;background:var(--lime);color:#7a6a4a}
.tk.done{background:var(--red);color:#fff8e6;border-color:var(--ink)}
.tk.next{border-color:var(--red);background:var(--gold);color:var(--ink)}
#hudBtns{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 200px)}
#btnAct{background:var(--red);color:#fff8e6;font-weight:700;border-color:var(--ink)}
#btnAct[disabled]{background:var(--lime);color:#7a6a4a}
#mini{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);cursor:pointer}
@media(max-width:700px){#mini{display:none}#hudBtns{max-width:100%}}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff8e6;padding:8px 16px;border-radius:4px;font-size:.95rem;max-width:calc(100% - 32px);text-align:center}

/* dialog + modal */
#dlg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 32px));z-index:30;background:var(--paper);border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:14px 18px;min-height:110px;cursor:pointer}
#dlgName{font-family:var(--serif);font-weight:900;color:var(--red);font-size:1.1rem}
#dlgText{font-family:var(--serif);font-size:1.15rem;line-height:1.8;margin-top:4px;min-height:3.6em}
#dlg small{position:absolute;right:14px;bottom:8px;opacity:.6}
#dlgSkip{position:absolute;right:12px;top:10px}
#modal{position:fixed;inset:0;z-index:35;background:rgba(42,29,20,.55);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modalBody{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);padding:clamp(14px,3vw,24px);width:min(640px,100%);max-height:100%;overflow:auto}
.lvlist{display:grid;gap:4px;max-height:55vh;overflow:auto}
.lvrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:4px 0;font-variant-numeric:tabular-nums}
.mx{position:absolute;top:10px;right:10px}
.mhead{padding-right:104px;min-height:2em;display:flex;justify-content:space-between;font-family:var(--serif);font-weight:900;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;line-height:1.7;margin:.4em 0 .8em}
.opts{display:grid;gap:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:4px;padding:.65em .9em;text-align:left;font-size:1.02rem}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt.ok{background:#cfe6b8;border-color:#3d6b3a}.opt.no{background:#f1c3bd;border-color:var(--red)}
.fb{min-height:3.2em;line-height:1.7;margin:.6em 0 0}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.gauge{height:14px;background:var(--lime);border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:6px}
.gauge i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.pads{display:grid;grid-template-columns:repeat(3,92px);grid-template-rows:repeat(3,92px);gap:8px;justify-content:center;margin:12px 0}
.pad{border:3px solid var(--ink);border-radius:8px;font-family:var(--serif);font-weight:900;font-size:1.05rem;line-height:1.25;background:var(--lime);color:var(--ink)}
.pad.lit{background:var(--gold);transform:scale(1.07);box-shadow:0 0 18px var(--gold)}
.pad[disabled]{cursor:default}
#tokenPop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
#tokenPop div{background:var(--paper);border:3px solid var(--red);border-radius:8px;padding:20px 34px;text-align:center;box-shadow:6px 6px 0 var(--ink);animation:pop .5s ease-out}
#tokenPop b{display:block;font-family:var(--serif);font-size:3.4rem;color:var(--red)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.slot{width:52px;height:52px;border:2px dashed var(--line);border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:1.6rem;background:#fff}
.chars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chb{width:60px;height:60px;border:3px solid var(--ink);border-radius:6px;background:var(--lime);font-family:var(--serif);font-weight:900;font-size:1.7rem;color:var(--ink)}
.chb[disabled]{opacity:.25;cursor:default}
.evs{display:grid;gap:8px}
.seqn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;background:var(--red);color:#fff8e6;border-radius:50%;margin-right:.5em;font-size:.9rem}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.fc{min-height:68px;border:3px solid var(--ink);border-radius:6px;background:var(--red);color:#fff8e6;font-family:var(--serif);font-weight:900;font-size:1.05rem;padding:4px;line-height:1.3}
.fc.up{background:#fff;color:var(--ink)}
.fc.kw{background:var(--red);color:#fff8e6}
.fc.km{background:#2e6f7e;color:#fff8e6}
.fc.up.kw{background:var(--gold);color:var(--ink)}
.fc.up.km{background:#bfe0e6;color:var(--ink)}
.fc .fl{display:block;font-size:.7rem;font-weight:700;opacity:.8;letter-spacing:.1em}
.lg{display:inline-block;padding:0 .5em;border-radius:3px;border:2px solid var(--ink);font-weight:700}
.lg.kw{background:var(--gold)}.lg.km{background:#bfe0e6}
.fc.done,.fc.done.kw,.fc.done.km{background:#cfe6b8;color:var(--ink);opacity:.7;cursor:default}
.tbar{height:12px;background:var(--lime);border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:6px}
.tbar i{display:block;height:100%;background:var(--red);width:100%}
@media(max-width:480px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.slot{width:44px;height:44px}.chb{width:52px;height:52px}}
@media(prefers-reduced-motion:reduce){#tokenPop div{animation:none}.gauge i{transition:none}}

/* summary */
.rows{display:grid;gap:6px;margin:12px 0}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0;font-variant-numeric:tabular-nums}
.grade{font-family:var(--serif);font-weight:900;font-size:4.5rem;color:var(--red);line-height:1;min-width:2.2em;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.grade.g-SSS{color:#e6a800;text-shadow:0 0 14px #ffd24a,3px 3px 0 var(--ink)}
.grade.g-SS,.grade.g-S{color:#ffd400}
.grade.g-B{color:#1c7ed6}
.grade.g-A{color:#d81e1e}
.grade.g-C{color:#2f9e44}
.grade.g-D{color:#8e44ad}
.grade.g-N{color:#868e96}
.sumTop{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}
</style>

<section id="cover" class="screen on" aria-label="封面">
  <div class="mtog"><button id="cvMus" aria-pressed="true" title="背景音樂">🎵</button><button id="cvMute" aria-pressed="true" title="全部聲音">♪</button></div>

<script>
(function(){
'use strict';
if(!window.THREE){document.body.innerHTML='<p style="padding:2em;font-size:1.1rem">無法載入 Three.js，請確認網路連線後重新整理。</p>';return;}

/* ================= 課程資料 ================= */
const PLAN=[ /* 0-1 楚國（人形）／2-6 百獸村（變身、取寶物）／7-9 回楚國匯報與考核 */
 {name:'戰國策與楚宮',type:'選擇題：背景說明',tk:'簡',tkName:'竹簡',built:true},

 {name:'文言分類',type:'選擇題：老虎、百獸、狐狸',tk:'分',tkName:'分類令',built:true},

 {name:'原文填空',type:'課文填空',tk:'文',tkName:'原文簡',built:true},

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

  g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.connect(g);g.connect(A.mus);o.start(t);o.stop(t+0.55);}

  const TM=[220,233.08,220,277.18,220,246.94,311.13,233.08];
  A.timer=setInterval(()=>{if(!A.ctx)return;while(A.next<A.ctx.currentTime+1){const t=A.next;
    if(A.tense){const beat=A.speed?0.2:0.3,s=A.ts++,b=s%8;

      if(b%2===0&&((s*7+bar*3)%5)<3)note(SC[5+((s*3+bar)%5)],t+0.02,0.9,'sine',0.1,A.mus,true);

function nearestFree(i,j){if(i>=0&&j>=0&&i<N&&j<N&&!blocked[j*N+i])return [i,j];
  for(let r=1;r<12;r++)for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){if(Math.max(Math.abs(dx),Math.abs(dz))!==r)continue;const a=i+dx,b=j+dz;if(a>=0&&b>=0&&a<N&&b<N&&!blocked[b*N+a])return [a,b];}
  return null;}
function astar(si,sj,ei,ej){const G=new Float32Array(N*N).fill(1e9),F=new Float32Array(N*N),P=new Int32Array(N*N).fill(-1),C=new Uint8Array(N*N);
  const h=(i,j)=>{const dx=Math.abs(i-ei),dz=Math.abs(j-ej);return Math.max(dx,dz)+0.414*Math.min(dx,dz);};
  const s=si+sj*N;G[s]=0;F[s]=h(si,sj);const open=[s];
  while(open.length){let bi=0;for(let k=1;k<open.length;k++)if(F[open[k]]<F[open[bi]])bi=k;const cur=open.splice(bi,1)[0];if(C[cur])continue;C[cur]=1;
    const x=cur%N,z=(cur/N)|0;
    if(x===ei&&z===ej){const path=[];let c=cur;while(c!==-1){path.push([c%N+0.5-40,((c/N)|0)+0.5-40]);c=P[c];}return path.reverse();}
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){if(!dx&&!dz)continue;const a=x+dx,b=z+dz;if(a<0||b<0||a>=N||b>=N||blocked[a+b*N])continue;
      if(dx&&dz&&(blocked[x+dx+z*N]||blocked[x+(z+dz)*N]))continue;const n=a+b*N,g=G[cur]+(dx&&dz?1.414:1);
      if(g<G[n]){G[n]=g;P[n]=cur;F[n]=g+h(a,b);open.push(n);}}}
  return null;}
let wps=[],busy=false,mode='cover';
function goTo(x,z){if(busy||mode!=='game')return false;
  const s=nearestFree(ci(player.position.x),ci(player.position.z));const e=nearestFree(ci(x),ci(z));if(!s||!e)return false;
  const p=astar(s[0],s[1],e[0],e[1]);if(!p)return false;p.shift();
  if(ci(x)===e[0]&&ci(z)===e[1]&&p.length)p[p.length-1]=[x,z];wps=p;return true;}

canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);

  else{cam.yaw-=dx*0.006;cam.pitch=Math.max(0.3,Math.min(1.3,cam.pitch+dy*0.005));}});

    const ray=new T.Raycaster();ray.setFromCamera(v,camera);const pt=new T.Vector3();if(ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),pt)){goTo(pt.x,pt.z);sfx('click');}}});

let last=performance.now(),tAcc=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;tAcc+=dt;if(document.hidden)return;
  if(mode==='cover'||mode==='game'){
    if(mode==='cover'){cam.yaw+=dt*0.08;cam.pitch=0.55;cam.dist=36;cam.t.lerp(new T.Vector3(-4,2,-6),0.05);}
    else{if(keys.q)cam.yaw+=dt*1.6;if(keys.e)cam.yaw-=dt*1.6;if(keys.r)cam.pitch=Math.min(1.3,cam.pitch+dt);if(keys.t)cam.pitch=Math.max(0.3,cam.pitch-dt);
      let mvx=0,mvz=0;
      if(!busy){const f=(keys.arrowup||keys.w?1:0)-(keys.arrowdown||keys.s?1:0),r=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
        if(f||r){wps=[];mvx=-Math.sin(cam.yaw)*f+Math.cos(cam.yaw)*r;mvz=-Math.cos(cam.yaw)*f-Math.sin(cam.yaw)*r;const l=Math.hypot(mvx,mvz)||1;mvx/=l;mvz/=l;
          const st=7*dt,px=player.position.x,pz=player.position.z,nx=px+mvx*st,nz=pz+mvz*st;
          if(!blocked[ci(nz)*N+ci(nx)]){player.position.x=nx;player.position.z=nz;}
          else if(!blocked[ci(pz)*N+ci(nx)])player.position.x=nx;
          else if(!blocked[ci(nz)*N+ci(px)])player.position.z=nz;
          player.rotation.y=Math.atan2(mvx,mvz);}}
      if(!busy){const px=player.position.x,pz=player.position.z,nz=Math.abs(pz+8)<3.6,now=performance.now();
        if(save.gateE&&!save.form&&!save.broken&&px>11)startTransform();
        else if(save.form&&save.gateW&&px<5.5&&nz)startRevert();
        else if(!save.gateE&&px>3.5&&px<6.6&&nz&&now>gateCd)startGate('E');
        else if(save.form&&!save.gateW&&px>9.4&&px<12.6&&nz&&now>gateCd)startGate('W');
        const cl=curLv();if(!busy&&cl>=0){const d=Math.hypot(px-LVPOS[cl][0],pz-LVPOS[cl][1]);if(d>3.4)armed=true;else if(d<2.3&&armed){armed=false;playLevel(cl);}}
        if(pendingReplay!==null&&!busy){const q=LVPOS[pendingReplay],d=Math.hypot(px-q[0],pz-q[1]);if(d<2.3){const k=pendingReplay;pendingReplay=null;playLevel(k);}else if(!wps.length&&!(mvx||mvz))pendingReplay=null;}}
      if(wps.length&&!busy){const w=wps[0],dx=w[0]-player.position.x,dz=w[1]-player.position.z,d=Math.hypot(dx,dz),st=7*dt;
        if(d<=st){player.position.x=w[0];player.position.z=w[1];wps.shift();}else{player.position.x+=dx/d*st;player.position.z+=dz/d*st;player.rotation.y=Math.atan2(dx,dz);}
        player.position.y=Math.abs(Math.sin(tAcc*14))*0.12;}else player.position.y=(mvx||mvz)?Math.abs(Math.sin(tAcc*14))*0.12:0;
      cam.t.lerp(new T.Vector3(player.position.x,1.2,player.position.z),0.12);
      const n=nearLv();$('#btnAct').disabled=(n<0||busy);
      lv.forEach((o,i)=>{o.ring.scale.setScalar(1+0.06*Math.sin(tAcc*3+i));o.npc.position.y=0;});
      const c=curLv();if(c>=0){const p=lv[c].npc;p.rotation.y=Math.atan2(player.position.x-LVPOS[c][0],player.position.z-LVPOS[c][1]);}
      drawMini();}
    doors.forEach(d=>{const tgt=-d.s*doorTarget*1.7;d.piv.rotation.y+=(tgt-d.piv.rotation.y)*Math.min(1,dt*3);});
    beasts.forEach((b,i)=>{if(b.m.visible)b.m.position.y=Math.abs(Math.sin(tAcc*2+i))*0.04;});
    const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
    camera.position.set(cam.t.x+Math.sin(cam.yaw)*cp*cam.dist,cam.t.y+sp*cam.dist,cam.t.z+Math.cos(cam.yaw)*cp*cam.dist);camera.lookAt(cam.t);
    renderer.render(scene,camera);}}

function snap(i){const s=STAGES[i],W=640,H=360;
  const pp=player.position.clone(),pr=player.rotation.y;
  tiger.visible=!!s.tiger;foxS.visible=!!s.fox;
  if(s.tiger){tiger.position.set(s.tiger[0],0,s.tiger[1]);tiger.rotation.y=s.tiger[2];}
  if(s.fox){foxS.position.set(s.fox[0],0,s.fox[1]);foxS.rotation.y=s.fox[2];}
  beasts.forEach((b,k)=>{b.m.visible=!!s.beasts;if(s.beasts){b.m.position.set(s.beasts[k][0],0,s.beasts[k][1]);b.m.rotation.y=Math.PI/2;}});
  if(s.me){player.position.set(s.me[0],0,s.me[1]);player.rotation.y=s.me[2];}else player.visible=false;
  renderer.setPixelRatio(1);renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  camera.position.set(s.cam[0],s.cam[1],s.cam[2]);camera.lookAt(s.at[0],s.at[1],s.at[2]);renderer.render(scene,camera);
  let url='';try{url=renderer.domElement.toDataURL('image/jpeg',0.82);}catch(e){}
  player.visible=true;player.position.copy(pp);player.rotation.y=pr;resize();defaultActors();return url;}

  $('#sumRows').innerHTML=PLAN.map((p,i)=>'<div><span>第 '+(i+1)+' 關　'+p.name+'</span><span>'+(save.res[i]?save.res[i].score+' 分（失誤 '+save.res[i].mistakes+'）':(p.built?'未完成':'尚未製作'))+'</span></div>').join('');
  show('summary');}
$('#btnSum').onclick=()=>{ac();if(!busy)openSummary();};
$('#sumBack').onclick=()=>{sfx('click');enterGame();};
let rc2=false;$('#sumReset').onclick=function(){if(!rc2){rc2=true;this.textContent='再按一次確認清除存檔';setTimeout(()=>{rc2=false;this.textContent='重新開始';},3000);return;}rc2=false;resetSave();placePlayer();setLook();applyProgress();this.textContent='重新開始';coverState();show('cover');};

function enterGame(){applyProgress();hud();show('game');busy=false;wps=[];syncAudioBtns();
  cam.t.set(player.position.x,1.2,player.position.z);cam.dist=20;
  toast('方向鍵或 W A S D 移動，也能點地面行走。Q／E／R／T 轉視角。走近發光圓圈按「互動」或 F，答題時可按 Esc 離開。',6500);}

/* 初始化 */
applyProgress();coverState();syncAudioBtns();
window.__game={A,place:(x,z)=>{player.position.set(x,0,z);},save:()=>save,startGate,applyBridge,startRevert,breakTrick,pos:()=>[player.position.x,player.position.z],startTransform,abortLevel,show,enterGame,startStory,snap,state:()=>({mode,busy,res:save.res}),playLevel};
})();
</script>
